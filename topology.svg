<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="422" height="405" viewBox="0 0 422 405" role="img" aria-label="Topology: Small Office / Home Office Network">
<title>Topology: Small Office / Home Office Network</title>
<style>
svg{color-scheme:light dark}
.bg{fill:Canvas}
.ln{stroke:CanvasText;stroke-opacity:.55;stroke-width:1.5}
.ln.down{stroke-dasharray:5 4}
.dev{fill:Canvas;stroke:CanvasText;stroke-width:1.5}
.t{fill:CanvasText;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{font-size:15px;font-weight:700}
.lbl{font-size:13px;font-weight:600}
.sub{font-size:10px;opacity:.65;letter-spacing:.06em}
.port{font-size:9.5px;opacity:.85;paint-order:stroke;stroke:Canvas;stroke-width:3px;stroke-linejoin:round}
</style>
<rect class="bg" fill="none" x="0" y="0" width="422" height="405"/>
<text class="t h" x="48" y="40">Small Office / Home Office Network</text>
<line class="ln" stroke="currentColor" x1="217.0" y1="115.0" x2="214.0" y2="235.0"/>
<line class="ln" stroke="currentColor" x1="214.0" y1="235.0" x2="114.0" y2="334.0"/>
<line class="ln" stroke="currentColor" x1="214.0" y1="235.0" x2="308.0" y2="331.0"/>
<text class="t port" text-anchor="middle" x="215.9" y="164.0">Gi0/0</text>
<text class="t port" text-anchor="middle" x="215.1" y="192.0">Fa0/1</text>
<text class="t port" text-anchor="middle" x="172.0" y="279.6">Fa0/2</text>
<text class="t port" text-anchor="middle" x="156.0" y="295.4">Eth0</text>
<text class="t port" text-anchor="middle" x="246.2" y="270.9">Fa0/3</text>
<text class="t port" text-anchor="middle" x="275.8" y="301.1">Eth0</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="151.0" y="92.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="217.0" y="113.0">Router-1</text>
<text class="t sub" text-anchor="middle" x="217.0" y="128.0">ROUTER</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="148.0" y="212.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="214.0" y="233.0">Switch-1</text>
<text class="t sub" text-anchor="middle" x="214.0" y="248.0">SWITCH</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="48.0" y="311.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="114.0" y="332.0">Pc-1</text>
<text class="t sub" text-anchor="middle" x="114.0" y="347.0">PC</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="242.0" y="308.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="308.0" y="329.0">Pc-2</text>
<text class="t sub" text-anchor="middle" x="308.0" y="344.0">PC</text>
